<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1d2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#f1f5f9">CIPE — Cryptographic Isomorphism Provenance Engine</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748b">System Architecture Diagram</text>

  <!-- ═══════════════ LEFT COLUMN: CLIENT ═══════════════ -->
  <rect x="20" y="90" width="160" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">CLIENT LAYER</text>

  <rect x="35" y="125" width="130" height="50" rx="8" fill="url(#blueGrad)" filter="url(#glow)"/>
  <text x="100" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="white">React UI</text>
  <text x="100" y="160" text-anchor="middle" font-size="10" fill="#bfdbfe">apps/web</text>
  <text x="100" y="173" text-anchor="middle" font-size="9" fill="#93c5fd">Port 3000</text>

  <rect x="35" y="200" width="130" height="40" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="220" text-anchor="middle" font-size="10" fill="#93c5fd">Code Upload Form</text>
  <text x="100" y="234" text-anchor="middle" font-size="9" fill="#64748b">Analyze / Compare</text>

  <rect x="35" y="255" width="130" height="40" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="275" text-anchor="middle" font-size="10" fill="#93c5fd">Results Dashboard</text>
  <text x="100" y="289" text-anchor="middle" font-size="9" fill="#64748b">Report + Evidence</text>

  <rect x="35" y="310" width="130" height="30" rx="6" fill="#0f1f35" stroke="#1e3a5f" stroke-width="1"/>
  <text x="100" y="330" text-anchor="middle" font-size="9" fill="#475569">Vite + React 18</text>

  <!-- HTTP Arrow -->
  <line x1="185" y1="200" x2="235" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="195" text-anchor="middle" font-size="9" fill="#64748b">HTTP</text>
  <line x1="235" y1="220" x2="185" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="235" text-anchor="middle" font-size="9" fill="#64748b">JSON</text>

  <!-- ═══════════════ MIDDLE COLUMN: API ═══════════════ -->
  <rect x="240" y="90" width="180" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="330" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">API LAYER</text>

  <rect x="255" y="125" width="150" height="50" rx="8" fill="url(#purpleGrad)" filter="url(#glow)"/>
  <text x="330" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Express API</text>
  <text x="330" y="160" text-anchor="middle" font-size="10" fill="#e9d5ff">apps/api</text>
  <text x="330" y="173" text-anchor="middle" font-size="9" fill="#c4b5fd">Port 5000</text>

  <rect x="255" y="188" width="150" height="30" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="330" y="208" text-anchor="middle" font-size="10" fill="#c4b5fd">POST /api/analyze</text>

  <rect x="255" y="228" width="150" height="30" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="330" y="248" text-anchor="middle" font-size="10" fill="#c4b5fd">POST /api/compare</text>

  <rect x="255" y="268" width="150" height="30" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="330" y="288" text-anchor="middle" font-size="10" fill="#c4b5fd">GET /api/health</text>

  <rect x="255" y="310" width="150" height="30" rx="6" fill="#0f0a1f" stroke="#2e1065" stroke-width="1"/>
  <text x="330" y="330" text-anchor="middle" font-size="9" fill="#475569">Node.js + Express</text>

  <!-- Arrow to Pipeline -->
  <line x1="425" y1="220" x2="465" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════ CORE PIPELINE COLUMN ═══════════════ -->
  <rect x="470" y="80" width="300" height="540" rx="12" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  <text x="620" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#f1f5f9">PROVENANCE ENGINE PIPELINE</text>
  <text x="620" y="120" text-anchor="middle" font-size="10" fill="#6b7280">packages/ (monorepo)</text>

  <!-- Pipeline Steps -->
  <!-- Step 1: Parser -->
  <rect x="490" y="135" width="260" height="50" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="620" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="white">① Parser (Babel)</text>
  <text x="620" y="170" text-anchor="middle" font-size="9" fill="#bfdbfe">JS → AST   |  Unsupported syntax detection</text>
  <text x="620" y="182" text-anchor="middle" font-size="8" fill="#93c5fd">packages/parser</text>

  <line x1="620" y1="185" x2="620" y2="200" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Scope -->
  <rect x="490" y="200" width="260" height="50" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="620" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#93c5fd">② Scope Engine</text>
  <text x="620" y="235" text-anchor="middle" font-size="9" fill="#bfdbfe">Lexical binding → canonical ID (d:N/b:M)</text>
  <text x="620" y="247" text-anchor="middle" font-size="8" fill="#60a5fa">packages/scope-engine</text>

  <line x1="620" y1="250" x2="620" y2="265" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Canonical IR -->
  <rect x="490" y="265" width="260" height="50" rx="8" fill="#6d28d9" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="620" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="white">③ Canonical IR Generator</text>
  <text x="620" y="300" text-anchor="middle" font-size="9" fill="#e9d5ff">AST → normalized IR  |  commutative sort</text>
  <text x="620" y="312" text-anchor="middle" font-size="8" fill="#c4b5fd">packages/canonical-ir  |  IR_VERSION 0.1</text>

  <line x1="620" y1="315" x2="620" y2="330" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: CFG -->
  <rect x="490" y="330" width="260" height="50" rx="8" fill="#14532d" stroke="#10b981" stroke-width="1"/>
  <text x="620" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#a7f3d0">④ CFG Engine</text>
  <text x="620" y="365" text-anchor="middle" font-size="9" fill="#6ee7b7">Basic blocks  |  Cycle detection + rejection</text>
  <text x="620" y="377" text-anchor="middle" font-size="8" fill="#34d399">packages/cfg-engine</text>

  <line x1="620" y1="380" x2="620" y2="395" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Dataflow -->
  <rect x="490" y="395" width="260" height="50" rx="8" fill="#14532d" stroke="#10b981" stroke-width="1"/>
  <text x="620" y="415" text-anchor="middle" font-size="11" font-weight="bold" fill="#a7f3d0">⑤ Dataflow Engine</text>
  <text x="620" y="430" text-anchor="middle" font-size="9" fill="#6ee7b7">Use-def chains  |  Dependency graph edges</text>
  <text x="620" y="442" text-anchor="middle" font-size="8" fill="#34d399">packages/dataflow-engine</text>

  <line x1="620" y1="445" x2="620" y2="460" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Fragment -->
  <rect x="490" y="460" width="260" height="50" rx="8" fill="#7c2d12" stroke="#f59e0b" stroke-width="1"/>
  <text x="620" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#fde68a">⑥ Fragment Engine</text>
  <text x="620" y="495" text-anchor="middle" font-size="9" fill="#fcd34d">Block + CFG + Dataflow edge fragments</text>
  <text x="620" y="507" text-anchor="middle" font-size="8" fill="#fbbf24">packages/fragment-engine</text>

  <line x1="620" y1="510" x2="620" y2="525" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 7: Fingerprint -->
  <rect x="490" y="525" width="260" height="55" rx="8" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="620" y="545" text-anchor="middle" font-size="11" font-weight="bold" fill="white">⑦ Fingerprint Engine (LSCH)</text>
  <text x="620" y="560" text-anchor="middle" font-size="9" fill="#fde68a">SHA-256 per fragment → Sorted concat hash</text>
  <text x="620" y="572" text-anchor="middle" font-size="8" fill="#fcd34d">F = SHA-256( sort(H₁, H₂, …Hₙ).join("") )</text>

  <!-- ═══════════════ RIGHT COLUMN: OUTPUT ═══════════════ -->
  <rect x="800" y="90" width="280" height="530" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="940" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">OUTPUT LAYER</text>

  <!-- Provenance Engine -->
  <rect x="820" y="125" width="240" height="60" rx="8" fill="#7c3aed" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="940" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Provenance Engine</text>
  <text x="940" y="162" text-anchor="middle" font-size="9" fill="#e9d5ff">Set intersection on fragment hashes</text>
  <text x="940" y="175" text-anchor="middle" font-size="8" fill="#c4b5fd">packages/provenance-engine</text>

  <!-- Confidence formula -->
  <rect x="820" y="200" width="240" height="50" rx="6" fill="#1e1040" stroke="#7c3aed" stroke-width="1"/>
  <text x="940" y="220" text-anchor="middle" font-size="10" fill="#c4b5fd">confidence = |A ∩ B| / min(|A|, |B|)</text>
  <text x="940" y="238" text-anchor="middle" font-size="9" fill="#7c3aed">EXACT_MATCH | PARTIAL_MATCH | NO_MATCH</text>

  <!-- MongoDB -->
  <rect x="820" y="265" width="240" height="60" rx="8" fill="#14532d" stroke="#10b981" stroke-width="1"/>
  <text x="940" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#a7f3d0">MongoDB (Persistence)</text>
  <text x="940" y="300" text-anchor="middle" font-size="9" fill="#6ee7b7">Projects | IRs | Fingerprints | Reports</text>
  <text x="940" y="315" text-anchor="middle" font-size="8" fill="#34d399">Graceful fallback if unavailable</text>

  <!-- Report -->
  <rect x="820" y="340" width="240" height="80" rx="8" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
  <text x="940" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6d3d1">Provenance Report</text>
  <text x="940" y="376" text-anchor="middle" font-size="9" fill="#a8a29e">• matchedFragments</text>
  <text x="940" y="391" text-anchor="middle" font-size="9" fill="#a8a29e">• addedFragments (suspect only)</text>
  <text x="940" y="406" text-anchor="middle" font-size="9" fill="#a8a29e">• missingFragments (original only)</text>

  <!-- Test results box -->
  <rect x="820" y="435" width="240" height="170" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="940" y="455" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b">Phase 4 Validation Results</text>
  <text x="835" y="472" font-size="9" fill="#10b981">✓ 18/18 matrix tests PASS</text>
  <text x="835" y="488" font-size="9" fill="#10b981">✓ 0/5 adversarial evasions</text>
  <text x="835" y="504" font-size="9" fill="#f59e0b">⚠ 4/10 mutation edge cases</text>
  <text x="835" y="520" font-size="9" fill="#10b981">✓ 5,000 lines in &lt; 1s</text>
  <text x="835" y="536" font-size="9" fill="#10b981">✓ CIPE: 18/18 correct</text>
  <text x="835" y="552" font-size="9" fill="#ef4444">✗ SHA-256 baseline: 2/18</text>
  <text x="835" y="568" font-size="9" fill="#ef4444">✗ Token baseline: 3/18</text>
  <text x="835" y="584" font-size="9" fill="#ef4444">✗ AST baseline: 2/18</text>

  <!-- Arrows from pipeline to output -->
  <line x1="750" y1="155" x2="815" y2="155" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="782" y="148" text-anchor="middle" font-size="8" fill="#8b5cf6">fingerprint</text>

  <!-- Legend -->
  <rect x="20" y="380" width="200" height="200" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="120" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">LEGEND</text>
  <rect x="35" y="415" width="14" height="10" rx="2" fill="#1d4ed8"/>
  <text x="55" y="425" font-size="9" fill="#94a3b8">Parsing / Input</text>
  <rect x="35" y="435" width="14" height="10" rx="2" fill="#6d28d9"/>
  <text x="55" y="445" font-size="9" fill="#94a3b8">IR Normalization</text>
  <rect x="35" y="455" width="14" height="10" rx="2" fill="#14532d"/>
  <text x="55" y="465" font-size="9" fill="#94a3b8">Graph Analysis</text>
  <rect x="35" y="475" width="14" height="10" rx="2" fill="#b45309"/>
  <text x="55" y="485" font-size="9" fill="#94a3b8">Fingerprinting</text>
  <rect x="35" y="495" width="14" height="10" rx="2" fill="#7c3aed"/>
  <text x="55" y="505" font-size="9" fill="#94a3b8">Provenance Comparison</text>
  <rect x="35" y="515" width="14" height="10" rx="2" fill="#14532d"/>
  <text x="55" y="525" font-size="9" fill="#94a3b8">Persistence</text>

  <!-- Footer -->
  <text x="550" y="710" text-anchor="middle" font-size="10" fill="#374151">CIPE Architecture v1.0  |  Phase 4 Complete  |  Generated 2026-08-21</text>
</svg>
